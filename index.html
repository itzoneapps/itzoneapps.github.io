<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IT ZONE</title>
<meta name="description" content="IT Zone Apps - private informational website for apps, projects and digital tools in development." />

<style>
:root{
  --line:#d8e3f0;
  --shadow:0 20px 50px rgba(20,55,95,.16);
  --text:#223146;
  --muted:#5f6f86;
  --blue:#2455b2;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#f7fbff,#eef4fb);color:var(--text);}
a{color:var(--blue);text-decoration:none;} a:hover{text-decoration:underline;}

.hero{margin:20px;min-height:300px;border-radius:28px;overflow:hidden;position:relative;background:url("logo3.jpg") center/cover no-repeat;box-shadow:var(--shadow);}
.hero-inner{position:relative;min-height:300px;padding:40px;}
.lang-wrap{position:absolute;top:16px;right:18px;z-index:5;}
.lang-select{height:42px;min-width:108px;border-radius:14px;border:1px solid rgba(0,0,0,.10);background:rgba(255,255,255,.88);padding:0 12px;font-size:14px;font-weight:700;cursor:pointer;}
.hero-meta{position:absolute;left:40px;bottom:6px;display:flex;gap:20px;font-weight:700;color:#111;font-size:14px;z-index:4;flex-wrap:wrap;}

.layout{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;}
.sidebar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:220px;}
.sidebar h3{margin-bottom:10px;font-size:18px;}
.sidebar button{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:700;font-size:14px;cursor:pointer;color:var(--text);}
.sidebar button.active{background:#eef5ff;color:#2455b2;border-color:#2455b2;}

.content{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;min-height:720px;}
.content h2{font-size:34px;margin-bottom:18px;}

.construction-box{min-height:560px;border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden;text-align:center;padding:40px 20px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,251,255,.98)),repeating-linear-gradient(45deg,rgba(36,85,178,.035) 0 12px,transparent 12px 24px);}
.construction-box h3{font-size:30px;margin-bottom:10px;}
.construction-box p{color:var(--muted);font-size:18px;line-height:1.6;max-width:760px;margin:0 auto;}
.legal-box{text-align:left;line-height:1.65;}
.legal-box h3{text-align:center;font-size:30px;margin-bottom:18px;}
.legal-box p{max-width:920px;margin:0 auto 14px;color:var(--muted);font-size:16px;}
.legal-box strong{color:var(--text);}

.apps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.app-card{border:1px solid var(--line);border-radius:22px;padding:24px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 14px 35px rgba(20,55,95,.10);}
.app-badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#eef5ff;color:#2455b2;font-size:12px;font-weight:800;margin-bottom:12px;}
.app-card h3{font-size:24px;margin-bottom:10px;}
.app-card p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:16px;}
.app-features{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.app-features span{border:1px solid var(--line);background:#fff;color:#5f6f86;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;}
.app-button{display:inline-block;padding:12px 16px;border-radius:14px;background:#2455b2;color:#fff;font-weight:800;font-size:14px;}
.app-button:hover{text-decoration:none;background:#1f4897;}

.footer-links{padding:32px 20px 46px;text-align:center;color:#8a96a8;font-size:11px;}
.footer-nav{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;opacity:.65;}
.footer-nav button{border:0;background:transparent;color:#7d899a;font-size:11px;cursor:pointer;padding:2px 3px;}
.footer-nav button:hover{color:#2455b2;text-decoration:underline;}
.footer-nav span{color:#aab4c2;}

.app-factory{position:relative;height:280px;margin-top:30px;border-radius:16px;background:#f4f8ff;border:1px solid var(--line);overflow:hidden;}
.factory-logo{position:absolute;top:10px;left:10px;background:#223146;color:#fff;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:800;}
.worker-factory{position:absolute;left:80px;top:90px;font-size:40px;animation:workerMove 1.2s infinite;}
.belt{position:absolute;left:20px;right:20px;bottom:80px;height:40px;background:#d8e3f0;border-radius:10px;overflow:hidden;}
.belt-line{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#999 0 10px,transparent 10px 20px);animation:beltMove 1s linear infinite;}
.app-part{position:absolute;top:5px;background:#fff;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;animation:moveParts 4s linear infinite;}
.part-2{animation-delay:.5s;} .part-3{animation-delay:1s;}
.machine{position:absolute;right:120px;bottom:70px;width:100px;height:100px;background:#223146;border-radius:12px;}
.machine-top{color:#fff;text-align:center;font-size:10px;margin-top:5px;}
.press{width:40px;height:30px;background:#fff;margin:20px auto;animation:press 1.5s infinite;}
.finished-app{position:absolute;right:70px;bottom:95px;font-size:35px;animation:appShow 4s infinite;}
.mini-crane-hook{position:absolute;right:40px;top:40px;font-size:20px;animation:craneMove 3s infinite;}
.train{position:absolute;right:10px;bottom:20px;font-size:40px;animation:trainMove 4s infinite;}

@keyframes workerMove{0%,100%{transform:rotate(-5deg) translateY(0);}50%{transform:rotate(7deg) translateY(-5px);}}
@keyframes beltMove{0%{transform:translateX(0);}100%{transform:translateX(20px);}}
@keyframes moveParts{0%{left:0;}100%{left:300px;opacity:0;}}
@keyframes press{0%,100%{transform:translateY(0);}50%{transform:translateY(20px);}}
@keyframes appShow{0%,50%{opacity:0;}60%,90%{opacity:1;}100%{opacity:0;}}
@keyframes craneMove{0%,100%{transform:translateX(0);}50%{transform:translateX(-30px);}}
@keyframes trainMove{0%,100%{transform:translateX(0);}50%{transform:translateX(-20px);}}

@media (max-width:900px){.layout{grid-template-columns:1fr;gap:16px;padding:16px;}.apps-grid{grid-template-columns:1fr;}}
@media (max-width:768px){
  .hero{margin:0;width:100%;min-height:235px;border-radius:0;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#fff;box-shadow:none;border-bottom:1px solid var(--line);}
  .hero-inner{min-height:235px;padding:14px;}.lang-wrap{top:14px;right:14px;}.hero-meta{left:18px;right:18px;bottom:10px;gap:12px;font-size:13px;}
  .layout{padding:14px;gap:14px;}.sidebar{border-radius:20px;padding:16px;min-height:auto;box-shadow:0 10px 30px rgba(20,55,95,.08);}.sidebar h3{font-size:20px;margin-bottom:12px;}
  .sidebar button{position:relative;font-size:16px;padding:14px 14px 14px 46px;border-radius:15px;margin-bottom:10px;}.sidebar button::before{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;}.sidebar button[data-key="home"]::before{content:"🏠";}.sidebar button[data-key="apps"]::before{content:"📱";}.sidebar button[data-key="news"]::before{content:"📰";}
  .content{padding:18px;min-height:620px;border-radius:20px;box-shadow:0 10px 30px rgba(20,55,95,.08);}.content h2{font-size:26px;margin-bottom:16px;}.construction-box{min-height:500px;border-radius:18px;padding:18px 10px 28px;}.construction-box h3{font-size:22px;}.construction-box p{font-size:15px;line-height:1.55;padding:0 4px;}.legal-box p{font-size:14px;}.app-card{padding:20px;border-radius:20px;}.app-card h3{font-size:22px;}.app-card p{font-size:15px;}.footer-links{padding:24px 16px 36px;font-size:11px;}
}
</style>
</head>

<body>
<div class="hero">
  <div class="hero-inner">
    <div class="lang-wrap">
      <select id="langSelect" class="lang-select">
        <option value="en">🇬🇧 EN</option>
        <option value="sr">🇷🇸 SR</option>
        <option value="de">🇦🇹 AT</option>
        <option value="hu">🇭🇺 HU</option>
      </select>
    </div>
    <div class="hero-meta"><div id="date"></div><div id="time"></div><div id="temp"></div></div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">
    <h3 id="menuTitle">Main menu</h3>
    <button class="nav-btn active" data-key="home" onclick="show('home',this)">Home</button>
    <button class="nav-btn" data-key="apps" onclick="show('apps',this)">Apps</button>
    <button class="nav-btn" data-key="news" onclick="show('news',this)">News</button>
  </aside>

  <main class="content">
    <h2 id="title"></h2>
    <div id="contentArea"></div>
  </main>
</div>

<footer class="footer-links">
  <div class="footer-nav">
    <button onclick="showFooterPage('contact')">Contact</button><span>•</span>
    <button onclick="showFooterPage('privacy')">Privacy Policy</button><span>•</span>
    <button onclick="showFooterPage('datenschutz')">Datenschutz</button><span>•</span>
    <button onclick="showFooterPage('agb')">Terms / AGB</button><span>•</span>
    <button onclick="showFooterPage('impressum')">Impressum</button>
  </div>
  <div id="footerText">© 2026 IT Zone Apps. All rights reserved.</div>
</footer>

<script>
const SUPPORT_EMAIL = "zivanoviclenard3@gmail.com";

const i18n = {
  en:{menuTitle:"Main menu",home:"Home",apps:"Apps",news:"News",footer:"© 2026 IT Zone Apps. All rights reserved.",constructionTitle:"Page under construction",constructionText:"This section is currently being built. New information, apps and updates will be added soon.",contact:"Contact",privacy:"Privacy Policy",datenschutz:"Data Protection",agb:"Terms / AGB",impressum:"Impressum"},

function appsHtml(){

    en:{skeki:"PDF scanner, blur, QR and photo tools in one app. The app is intended for quick image editing, document scanning, QR code creation and file preparation for sharing.",health:"An app in development for tracking health entries such as blood pressure, blood sugar, pulse, weight and personal notes.",soon:"Coming soon",prep:"In development"},

      <p><strong>18. Changes to this policy</strong></p><p>This Privacy Policy may be updated when apps, features, technologies, legal requirements or services change.</p>`;

      <p><strong>6. Health app projekti</strong></p><p>Buduće aplikacije vezane za zdravlje mogu omogućiti korisniku da unosi i čuva zdravstvene podatke kao što su krvni pritisak, šećer u krvi, puls, težina i napomene. Te podatke korisnik unosi dobrovoljno i koriste se samo za funkcionalnost aplikacije, istoriju, backup, sinhronizaciju ili export, ako su te funkcije dostupne.</p>
      <p><strong>7. Medicinska napomena</strong></p><p>Aplikacije IT Zone Apps koje se odnose na zdravlje služe isključivo za informativno i lično praćenje. One nisu medicinski uređaji, ne dijagnostikuju, ne leče, ne sprečavaju bolesti i ne daju medicinski savet. Za medicinske odluke uvek se obratite lekaru ili kvalifikovanom zdravstvenom radniku.</p>
      <p><strong>8. Nalog, cloud čuvanje i backup</strong></p><p>Ako aplikacija nudi registraciju, cloud backup ili sinhronizaciju, svrha je da korisnik sačuva podatke, pristupi istoriji na više uređaja i obnovi podatke prilikom promene telefona. Podaci mogu biti čuvani preko cloud backend provajdera, na primer Supabase ili sličnog servisa. Konkretna upotreba zavisi od verzije aplikacije i uključenih funkcija.</p>
      <p><strong>9. Premium funkcije i kupovine</strong></p><p>Ako aplikacija nudi premium funkcije, kupovine ili pretplate se obrađuju preko Google Play Billing sistema. IT Zone Apps ne prima i ne čuva pune podatke platnih kartica. Plaćanje obrađuje Google prema uslovima i politici privatnosti Google Play-a.</p>
      <p><strong>10. Reklame</strong></p><p>Neke besplatne verzije aplikacija mogu prikazivati reklame. Ako se koriste reklame, one mogu biti prikazane preko Google AdMob-a ili drugog reklamnog provajdera. Reklamni provajderi mogu obrađivati identifikatore uređaja, približnu lokaciju, interakcije sa reklamama ili dijagnostičke podatke prema svojim pravilima. Premium verzije mogu ukloniti reklame ako je ta funkcija dostupna.</p>
      <p><strong>11. Kontakt putem emaila</strong></p><p>Ako nas kontaktirate emailom, podaci koje dobrovoljno pošaljete, kao što su email adresa i sadržaj poruke, koriste se samo za obradu i odgovor na vaš zahtev. Email komunikacija se može čuvati onoliko dugo koliko je potrebno za dokumentaciju i podršku.</p>
      <p><strong>12. Tehnički podaci web stranice</strong></p><p>Prilikom posete ovoj web stranici, hosting provajder može automatski obrađivati tehničke podatke kao što su IP adresa, vreme pristupa, tip browsera, operativni sistem i posećene stranice. To je potrebno za siguran i stabilan rad web stranice.</p>
      <p><strong>13. Vremenske informacije</strong></p><p>Ova web stranica može zatražiti osnovne informacije o vremenu od eksternog servisa za prikaz temperature. To se koristi samo za prikaz.</p>
      <p><strong>14. Cookies i local storage</strong></p><p>Web stranica može koristiti local storage ili osnovne cookies za pamćenje jezika. Na ovoj stranici se namerno ne koriste reklamni tracking cookies.</p>
      <p><strong>15. Deljenje podataka</strong></p><p>IT Zone Apps ne prodaje lične podatke i ne deli ih trećim licima u marketinške svrhe. Podaci mogu biti obrađeni ili preneti kada je to tehnički potrebno, zakonski obavezno, zatraženo od korisnika ili potrebno za funkcije aplikacije kao što su cloud čuvanje, plaćanje ili reklame.</p>
      <p><strong>16. Bezbednost podataka</strong></p><p>Koriste se razumne tehničke i organizacione mere za zaštitu podataka korisnika. Ipak, nijedan elektronski sistem prenosa ili čuvanja ne može biti garantovano 100% siguran.</p>

function footerPageHtml(page){
  return `<div class="construction-box legal-box">${legalText(page)}</div>`;
}

function applyLanguage(){
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang;
  document.getElementById("menuTitle").innerText = t.menuTitle;
  document.getElementById("footerText").innerText = t.footer;
  document.querySelector('[data-key="home"]').innerText = t.home;
  document.querySelector('[data-key="apps"]').innerText = t.apps;
  document.querySelector('[data-key="news"]').innerText = t.news;
  render(currentPage);
  updateTime();
}

function show(pageKey, btn){
  currentPage = pageKey;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  render(pageKey);
}

function showFooterPage(pageKey){
  currentPage = pageKey;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  render(pageKey);
  window.scrollTo({top:document.querySelector(".content").offsetTop - 20,behavior:"smooth"});
}

function render(pageKey){
  const t = i18n[currentLang];
  if(pageKey === "home"){
    document.getElementById("title").innerText = t.home;
    document.getElementById("contentArea").innerHTML = homeHtml();
    return;
  }
  if(pageKey === "apps"){
    document.getElementById("title").innerText = t.apps;
    document.getElementById("contentArea").innerHTML = appsHtml();
    return;
  }
  if(pageKey === "news"){
    document.getElementById("title").innerText = t.news;
    document.getElementById("contentArea").innerHTML = newsHtml();
    return;
  }
  document.getElementById("title").innerText = t[pageKey] || pageKey;
  document.getElementById("contentArea").innerHTML = footerPageHtml(pageKey);
}

function updateTime(){
  const now = new Date();
  document.getElementById("date").innerText = now.toLocaleDateString(localeForLang(currentLang));
  document.getElementById("time").innerText = now.toLocaleTimeString(localeForLang(currentLang));
}

fetch("https://api.open-meteo.com/v1/forecast?latitude=48.2&longitude=16.37&current_weather=true")
.then(r=>r.json())
.then(d=>{document.getElementById("temp").innerText = Math.round(d.current_weather.temperature) + "°C";})
.catch(()=>{document.getElementById("temp").innerText = "24°C";});

document.getElementById("langSelect").value = currentLang;
document.getElementById("langSelect").addEventListener("change", function(){
  currentLang = this.value;
  localStorage.setItem("site_lang", currentLang);
  applyLanguage();
});

setInterval(updateTime,1000);
applyLanguage();
